<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
 <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Gestão Imobiliária</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 <style>
  body{background:#f4f6fb}.navbar{background:#172554}.card{border:0;border-radius:16px;box-shadow:0 5px 20px #14213d12}
  .btn-primary{background:#2563eb;border:0}.page-title{font-weight:750;color:#172554}
 </style>
</head>
<body>
<nav class="navbar navbar-dark mb-4"><div class="container"><span class="navbar-brand fw-bold">🏠 Gestão Imobiliária</span></div></nav>
<main class="container pb-5">
 <div class="mb-4"><h1 class="page-title">Painel de imóveis</h1><p class="text-secondary">Cadastre e consulte os imóveis da imobiliária.</p></div>
 <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
 <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
 <div class="card p-4 mb-4">
  <h4 class="mb-3">Cadastrar imóvel</h4>
 
<form th:action="@{/imoveis}" method="post">
    <div class="row g-3">

        <div class="col-md-6">
            <label class="form-label">Descrição</label>
            <input class="form-control"
                   type="text"
                   name="descricao"
                   placeholder="Ex.: Casa com 2 quartos"
                   required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Endereço</label>
            <input class="form-control"
                   type="text"
                   name="endereco"
                   placeholder="Rua, número e bairro"
                   required>
        </div>

        <div class="col-md-4">
            <label class="form-label">Tipo</label>
            <select class="form-select" name="tipo" required>
                <option value="">Selecione</option>
                <option value="Casa">Casa</option>
                <option value="Apartamento">Apartamento</option>
                <option value="Terreno">Terreno</option>
            </select>
        </div>

        <div class="col-md-4">
            <label class="form-label">Valor (R$)</label>
            <input class="form-control"
                   type="number"
                   name="valor"
                   min="0.01"
                   step="0.01"
                   placeholder="250000.00"
                   required>
        </div>

        <div class="col-md-4">
            <label class="form-label">Disponibilidade</label>
            <select class="form-select" name="disponivel" required>
                <option value="true">Disponível</option>
                <option value="false">Indisponível</option>
            </select>
        </div>

    </div>

    <div class="mt-4">
        <button class="btn btn-primary px-4" type="submit">
            Cadastrar imóvel
        </button>
    </div>
</form>

 </div>
 <div class="card p-4">
  <div class="d-flex justify-content-between align-items-center mb-3"><h4 class="mb-0">Imóveis cadastrados</h4><span class="badge text-bg-primary" th:text="${imoveis != null ? #lists.size(imoveis) + ' imóvel(is)' : '0 imóveis'}"></span></div>
  <div class="table-responsive">
   <table class="table table-hover align-middle">
    <thead class="table-light"><tr><th>ID</th><th>Descrição</th><th>Endereço</th><th>Tipo</th><th>Valor</th><th>Disponibilidade</th></tr></thead>
    <tbody>
     <tr th:if="${imoveis == null or #lists.isEmpty(imoveis)}"><td colspan="6" class="text-center text-secondary py-4">Nenhum imóvel cadastrado.</td></tr>
     <tr th:each="item : ${imoveis}">
      <td th:text="${item.id}"></td><td th:text="${item.descricao}"></td><td th:text="${item.endereco}"></td><td th:text="${item.tipo}"></td>
      <td th:text="${'R$ ' + #numbers.formatDecimal(item.valor, 1, 'POINT', 2, 'COMMA')}"></td>
      <td><span class="badge" th:classappend="${item.disponivel} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${item.disponivel} ? 'Disponível' : 'Indisponível'"></span></td>
     </tr>
    </tbody>
   </table>
  </div>
 </div>
 <p class="text-center text-secondary small mt-4">Sistema de Gestão Imobiliária • Frontend conectado à API REST</p>
</main>
</body></html>
